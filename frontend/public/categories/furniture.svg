<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sofaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Armchair / Sofa backrest -->
  <rect x="22" y="24" width="56" height="38" rx="8" fill="url(#sofaGrad)" stroke="#075985" stroke-width="2"/>
  <!-- Seat cushion -->
  <rect x="20" y="52" width="60" height="20" rx="6" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <!-- Left armrest -->
  <rect x="14" y="42" width="14" height="28" rx="6" fill="url(#sofaGrad)" stroke="#075985" stroke-width="2"/>
  <!-- Right armrest -->
  <rect x="72" y="42" width="14" height="28" rx="6" fill="url(#sofaGrad)" stroke="#075985" stroke-width="2"/>
  <!-- Wooden legs -->
  <line x1="22" y1="74" x2="16" y2="86" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  <line x1="78" y1="74" x2="84" y2="86" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
</svg>