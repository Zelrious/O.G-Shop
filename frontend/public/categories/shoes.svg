<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Sneaker and bag -->
  <defs>
    <linearGradient id="shoeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <!-- Main shoe body -->
  <path d="M16 54 C16 46, 26 38, 38 36 L54 36 L62 46 L82 48 C90 48, 92 56, 92 64 L92 72 L16 72 Z" fill="url(#shoeGrad)" stroke="#9f1239" stroke-width="2"/>
  <!-- White thick sole -->
  <rect x="14" y="70" width="80" height="12" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Dynamic swoosh / stripe -->
  <path d="M42 44 L66 62" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Laces -->
  <line x1="40" y1="36" x2="48" y2="44" stroke="#fecdd3" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="36" x2="54" y2="44" stroke="#fecdd3" stroke-width="2" stroke-linecap="round"/>
</svg>