<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Collectible Robot / Action Figure & Cube -->
  <defs>
    <linearGradient id="toyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>
  <!-- Robot Head -->
  <rect x="36" y="20" width="28" height="24" rx="6" fill="url(#toyGrad)" stroke="#581c87" stroke-width="2"/>
  <!-- Antenna -->
  <line x1="50" y1="20" x2="50" y2="12" stroke="#eab308" stroke-width="2.5"/>
  <circle cx="50" cy="11" r="3" fill="#eab308"/>
  <!-- Eyes -->
  <circle cx="44" cy="30" r="3.5" fill="#38bdf8"/>
  <circle cx="56" cy="30" r="3.5" fill="#38bdf8"/>
  <!-- Smile -->
  <line x1="44" y1="38" x2="56" y2="38" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="30" y="46" width="40" height="30" rx="6" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
  <!-- Meter / dial on chest -->
  <circle cx="50" cy="58" r="6" fill="#fef08a"/>
  <line x1="50" y1="58" x2="53" y2="55" stroke="#78350f" stroke-width="1.5"/>
  <!-- Arms -->
  <rect x="20" y="50" width="8" height="18" rx="4" fill="#a855f7"/>
  <rect x="72" y="50" width="8" height="18" rx="4" fill="#a855f7"/>
  <!-- Legs -->
  <rect x="36" y="78" width="10" height="10" rx="3" fill="#1e293b"/>
  <rect x="54" y="78" width="10" height="10" rx="3" fill="#1e293b"/>
</svg>