  <circle cx="28" cy="62" r="16" fill="none" stroke="#1e293b" stroke-width="4"/>
  <circle cx="28" cy="62" r="4" fill="#64748b"/>
  <!-- Right wheel -->
  <circle cx="72" cy="62" r="16" fill="none" stroke="#1e293b" stroke-width="4"/>
  <circle cx="72" cy="62" r="4" fill="#64748b"/>
  <!-- Bike Frame -->
  <polygon points="28,62 48,62 64,44 44,44" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linejoin="round"/>
  <line x1="48" y1="62" x2="44" y2="44" stroke="#10b981" stroke-width="3.5"/>
  <line x1="44" y1="44" x2="40" y2="34" stroke="#1e293b" stroke-width="3"/>
  <!-- Saddle -->
  <line x1="36" y1="34" x2="46" y2="34" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <!-- Handlebars -->
  <line x1="72" y1="62" x2="62" y2="32" stroke="#1e293b" stroke-width="3.5"/>
