<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Metal strap -->
  <rect x="42" y="10" width="16" height="80" rx="3" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <!-- Watch round case -->
  <circle cx="50" cy="50" r="26" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="50" cy="50" r="22" fill="#1e293b"/>
  <!-- Subdials -->
  <circle cx="44" cy="46" r="4.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="56" cy="46" r="4.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="50" cy="58" r="4.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <!-- Hands -->
  <line x1="50" y1="50" x2="50" y2="36" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="60" y2="50" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="2" fill="#fbbf24"/>
  <!-- Crown -->
  <rect x="76" y="47" width="4" height="6" rx="1" fill="#cbd5e1"/>
