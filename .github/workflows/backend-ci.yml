name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: og_shop_test
          POSTGRES_USER: test_ci_user
          POSTGRES_PASSWORD: test_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify Backend
        env:
          OGSHOP_TEST_DB_URL: jdbc:postgresql://localhost:5432/og_shop_test
          OGSHOP_TEST_DB_USER: test_ci_user
          OGSHOP_TEST_DB_PASSWORD: test_ci_password
          OGSHOP_TEST_DB_ISOLATED: "true"
        run: ./mvnw --batch-mode --no-transfer-progress verify
