spring:
  datasource:
    url: jdbc:h2:mem:og_shop_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

app:
  auth:
    jwt-signing-key: test-signing-key-with-at-least-thirty-two-bytes
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    frontend-origin: http://localhost:5173
    refresh-cookie-name: og_refresh
    refresh-cookie-secure: false
    refresh-cookie-path: /api/v1/auth/refresh
  ekyc:
    base-url: http://localhost:8001
    internal-token: test-internal-token-with-sufficient-entropy
    connect-timeout: PT1S
    read-timeout: PT2S
