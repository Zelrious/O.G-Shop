spring:
  datasource:
    url: jdbc:h2:mem:og_shop_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.hbm2ddl.create_namespaces: true
  flyway:
    enabled: false

management:
  health:
    mail:
      enabled: false

app:
  environment: DEV
  vouchers:
    reminders-enabled: false
  chat:
    expiry-enabled: false
    cleanup-enabled: false
  notifications:
    dispatch-enabled: false
  registration:
    cleanup-enabled: false
  auth:
    jwt-signing-key: test-signing-key-with-at-least-thirty-two-bytes
    access-token-ttl: PT15M
    frontend-origin: http://localhost:5173
    session-cookie-name: og_access
    session-cookie-secure: false
    session-cookie-path: /api/v1/auth
  ekyc:
    base-url: http://localhost:8001
    internal-token: test-internal-token-with-sufficient-entropy
    connect-timeout: PT1S
    read-timeout: PT2S
  vnpay:
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    tmn-code: OHS7QVO0
    hash-secret: local-test-only-hmac-key-please-do-not-use-live
    ipn-url: http://localhost:8080/api/v1/payments/vnpay-ipn
    return-url: http://localhost:5173/payment/vnpay-return
  seller-verification:
    mode: MVP_BYPASS
  scheduling:
    order-expiry:
      enabled: false
  ghn:
    base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api/}
    api-token: ${GHN_API_TOKEN:test-token-dummy}
    shop-id: ${GHN_SHOP_ID:229762}
    connect-timeout: ${GHN_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${GHN_READ_TIMEOUT:PT10S}
    webhook-secret: ${GHN_WEBHOOK_SECRET:test-webhook-secret-key-12345}
    reconciliation:
      enabled: false
