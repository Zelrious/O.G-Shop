spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  application:
    name: og-shop-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/og_shop}
    username: ${DB_USERNAME:og_shop}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.hbm2ddl.extra_physical_table_types: VIEW
    open-in-view: false
  flyway:
    enabled: true
    default-schema: public
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:60MB}

app:
  environment: ${APP_ENVIRONMENT:PROD}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  registration:
    otp-ttl: ${REGISTRATION_OTP_TTL:PT5M}
    draft-ttl: ${REGISTRATION_DRAFT_TTL:PT30M}
    resend-cooldown: ${REGISTRATION_RESEND_COOLDOWN:PT60S}
    max-attempts: 5
    email-hourly-limit: 5
    ip-hourly-limit: ${IP_HOURLY_LIMIT:60}
    mail-enabled: ${OTP_MAIL_ENABLED:false}
    from: ${SMTP_FROM:no-reply@ogshop.test}
    cleanup-enabled: true
  auth:
    jwt-signing-key: ${JWT_SIGNING_KEY:replace-with-at-least-32-random-bytes}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT15M}
    frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:5173}
    session-cookie-name: ${AUTH_SESSION_COOKIE_NAME:og_access}
    session-cookie-secure: ${AUTH_SESSION_COOKIE_SECURE:false}
    session-cookie-path: ${AUTH_SESSION_COOKIE_PATH:/api/v1/auth}
  ekyc:
    base-url: ${EKYC_SERVICE_URL:http://localhost:8001}
    internal-token: ${EKYC_INTERNAL_TOKEN:replace-with-a-long-random-internal-token}
    connect-timeout: ${EKYC_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${EKYC_READ_TIMEOUT:PT60S}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    url: ${CLOUDINARY_URL:}
  seller-verification:
    mode: ${SELLER_VERIFICATION_MODE:MVP_BYPASS}
  vnpay:
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay-ipn}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
  ghn:
    base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api/}
    api-token: ${GHN_API_TOKEN}
    shop-id: ${GHN_SHOP_ID}
    connect-timeout: ${GHN_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${GHN_READ_TIMEOUT:PT10S}
    webhook-secret: ${GHN_WEBHOOK_SECRET:}
    reconciliation:
      enabled: ${GHN_RECONCILIATION_ENABLED:true}
      cron: ${GHN_RECONCILIATION_CRON:0 */30 * * * *}
      batch-size: ${GHN_RECONCILIATION_BATCH_SIZE:50}
    simulation-enabled: ${GHN_SIMULATION_ENABLED:false}
server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    mail:
      enabled: ${OTP_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
