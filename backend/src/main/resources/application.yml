spring:
  application:
    name: og-shop-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/og_shop}
    username: ${DB_USERNAME:og_shop}
    password: ${DB_PASSWORD:change-me-for-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 12MB

app:
  auth:
    jwt-signing-key: ${JWT_SIGNING_KEY}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P30D}
    frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:5173}
    refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME:og_refresh}
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
    refresh-cookie-path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth/refresh}
  ekyc:
    base-url: ${EKYC_SERVICE_URL:http://localhost:8001}
    internal-token: ${EKYC_INTERNAL_TOKEN}
    connect-timeout: ${EKYC_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${EKYC_READ_TIMEOUT:PT60S}
  vnpay:
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay-ipn}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
